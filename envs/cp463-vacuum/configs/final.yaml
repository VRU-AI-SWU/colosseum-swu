# CP463 1/2026 · Competition 1 · Phase Final (สัปดาห์ 7)
# ค่าตาม environment-spec.md §11
#
# ทดสอบว่า generalize ได้จริง ไม่ใช่จำ config เดิม — ห้องใหญ่ขึ้น หน้าต่างแคบลง
# และเพิ่ม sensor_noise เข้ามาเป็นครั้งแรก
task: vacuum_gridworld
version: 1.0.0
phase: final

room:
  width: 30
  height: 30
  obstacle_density: 0.22 # ⚠️ ค่าที่ต้อง calibrate (§15)
  obstacle_generator: clustered
  dirt_distribution: clustered # ฝุ่นเกาะกลุ่มเป็นหย่อม
  dirt_ratio: 0.60
  guarantee_connected: true

robot:
  start: random
  observation: local
  observation_window: 3 # แคบลงจาก Main
  battery: null
  move_cost: 1
  suck_cost: 2

dynamics:
  action_noise: 0.10
  sticky_dirt: 0.15
  # calibrate 2 รอบ (ส.ค. 2026) — ค่านี้เปลี่ยนสองครั้งและเหตุผลก็เปลี่ยนไปด้วย
  #
  #   0.05 (ร่างแรก)   → Gold ดูดครบแค่ 2/30 ตัดสินว่าแรงเกิน
  #   0.01 (รอบที่ 1)  → Gold ครบ 21/30 ดูดี **แต่ตัดสินโดยใช้ Gold เป็นเพดาน ซึ่งผิด**
  #   0.02 (รอบที่ 2)  → หลังมี BeliefBFSAgent ที่กรอง noise เป็น จึงเห็นว่าเพดานจริงสูงกว่านั้นมาก
  #
  # ที่ 0.01 ช่องว่าง Diamond − Gold = +0.178 แต่ CI คร่อมศูนย์ → แยกสองระดับไม่ออก
  # ที่ 0.02 ช่องว่างเป็น +0.517 CI [+0.293, +0.736] และ Diamond ยังดูดครบ 23/30 (77%)
  # นี่คือ phase ที่ทักษะ "จัดการ observation ที่เชื่อไม่ได้" เป็นตัวตัดสินหลัก
  sensor_noise: 0.02

episode:
  # ยืนยันแล้วว่า max_steps ไม่ใช่ตัวคุมของ phase นี้ — เพิ่มเป็น 4000 แล้ว Gold ดูดครบ
  # 20/30 ซึ่งไม่ต่างจาก 3000 (21/30) ตัวที่ผูกพันจริงคือ sensor_noise
  max_steps: 3000
  stop_on_full_coverage: true
  step_timeout_ms: 1000

penalties:
  collision: 1.0
  redundant_suck: 0.2

scoring:
  metric: coverage_auc
  completion_bonus: 1.0
  max_penalty: 0.2
