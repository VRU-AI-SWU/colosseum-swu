[project]
name = "cp463-vacuum"
version = "1.0.0"
description = "Vacuum cleaner grid world environment for CP463 1/2026 (Arena competition 1)"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }

# เวอร์ชันเหล่านี้ต้องเหมือนกันเป๊ะทั้ง starter kit และ runner image (env-spec §12)
# numpy pin เป็น load-bearing: Generator stream ไม่การันตีข้ามเวอร์ชัน (env-spec §2 ข้อ 3)
dependencies = [
    "numpy==2.1.*",
    "gymnasium==1.3.*",
    "zstandard==0.23.*",
    "pyyaml==6.*",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vacuum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: การทดสอบที่ต้องรัน baseline ครบทุก seed (ใช้ `-m 'not slow'` ตอนพัฒนา)",
]
