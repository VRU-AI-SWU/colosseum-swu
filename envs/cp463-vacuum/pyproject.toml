[project]
name = "cp463-vacuum"
# ⚠️ **เลขนี้ไม่ใช่ `env_version`** และไม่ต้องตรงกัน
#
#   version (ตรงนี้)  เลขของ *แพ็กเกจ* — ขยับได้ทุกครั้งที่แก้เอกสารหรือ CLI
#   env_version       เลขของ *สัญญาการให้คะแนน* อยู่ใน vacuum/__init__.py
#                     ขยับเมื่อไร = คะแนนเก่าทั้งหมดเทียบไม่ได้ ต้อง rejudge
#
# 1.0.1 นี้แก้แค่ช่วงเวอร์ชันที่รองรับกับเอกสาร — env_version จึงยังเป็น 1.0.0
version = "1.0.3"
description = "Vacuum cleaner grid world environment for CP463 1/2026 (Arena competition 1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# **สิ่งที่รับประกันความตรงกันคือ `vacuum.selfcheck` ไม่ใช่เลขเวอร์ชันตรงนี้**
#
# `numpy.random.Generator` ไม่การันตี stream ข้ามเวอร์ชัน (env-spec §2 ข้อ 3) แต่การ
# ตรึงเวอร์ชันก็ไม่ได้รับประกันอะไรเช่นกัน — numpy เปลี่ยน stream ภายใน 2.1.x ก็ได้
# ตัวที่จับได้จริงคือ selfcheck ซึ่งเทียบคะแนน baseline กับค่า golden ที่บันทึกไว้
#
# วัดแล้ว: python 3.11 / 3.12 / 3.13 / 3.14 และ numpy 2.1.3 / 2.5.2 ให้ผังห้องแฮช
# เดียวกัน คะแนนตรงถึงทศนิยมที่ 12 conformance 32 ข้อผ่าน และ pin_baselines --check
# บน public seeds จริงผ่านทั้ง 3 phase
#
# ช่วงที่ตั้งไว้จึงกว้างพอให้ติดตั้งได้บนเครื่องนิสิตจริง (3.14 มากับ numpy 2.5
# เพราะ 2.1 ไม่มี wheel ให้) แล้วให้ selfcheck เป็นด่านตรวจแทน
dependencies = [
    "numpy>=2.1,<3",
    "gymnasium>=1.3,<2",
    "zstandard==0.23.*",
    "pyyaml==6.*",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]
# ใช้เฉพาะ examples/train_ppo.py — ไม่ใช่ dependency ของ environment
# environment เองต้องรันได้โดยไม่มี torch เพราะ runner ที่ประเมินผลไม่ควรต้องลง torch
train = ["torch>=2.4", "stable-baselines3>=2.4", "sb3-contrib>=2.4", "tensorboard>=2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vacuum"]
# starter README อ้างถึง examples/ — ต้องแพ็กไปด้วย ไม่งั้นนิสิตเปิดไม่เจอ
force-include = { "examples" = "vacuum/examples" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: การทดสอบที่ต้องรัน baseline ครบทุก seed (ใช้ `-m 'not slow'` ตอนพัฒนา)",
]
