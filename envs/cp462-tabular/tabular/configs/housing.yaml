# R² เพราะมันเทียบกับการทายค่าเฉลี่ยอยู่แล้ว จึงอ่านออกทันทีว่าโมเดลมีประโยชน์ไหม
# และเป็นแบบ "มากกว่าดีกว่า" โดยธรรมชาติ ไม่ต้องกลับเครื่องหมาย
primary: r2

n_rows: 12000

data_seed: 20260201
split_seed: 20260202
