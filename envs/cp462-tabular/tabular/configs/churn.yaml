# CP462 · โจทย์ที่ 1 — classification
#
# ⚠️ ทุกค่าในไฟล์นี้ (ยกเว้น title) เข้า `config_hash` ซึ่งบันทึกลงทุก run
#    การแก้กลางเทอมแปลว่าคะแนนเก่าเทียบกับคะแนนใหม่ไม่ได้ ต้อง rejudge

slug: churn
task: churn
title: "ทำนายการเลิกใช้บริการ"
kind: classification

# macro-F1 เพราะคลาสไม่สมดุล (~26% เป็นคลาสบวก) — accuracy จะดูดีเกินจริง
# เพราะทายคลาสเดียวรวดก็ได้ ~74% แล้ว
primary: macro_f1
labels: [0, 1]

n_rows: 12000

# เมล็ดแยกกันทั้งสามตัวโดยตั้งใจ — ดูเหตุผลใน config.py
data_seed: 20260101
split_seed: 20260102
bootstrap_seed: 20260103

# train / val / test — **ทั้งสามส่วนนิสิตมีอยู่แล้ว**
ratios: [0.60, 0.15, 0.25]

# ── ชุดที่ใช้ตัดสิน ────────────────────────────────────────────────
# **เป็น dataset คนละใบกับข้างบน** สร้างจาก `grading_seed` ที่อยู่ใน ARENA_SECRETS
# เท่านั้น — ไม่ได้อยู่ในไฟล์นี้และไม่ได้อยู่ในแพ็กเกจที่คุณติดตั้ง โดยตั้งใจ
# ถ้ามันอยู่ที่นี่ ใครก็คำนวณเฉลยของชุดที่ใช้ตัดสินเองได้ทั้งหมด
#
# ขนาดประกาศไว้ตรงนี้ได้เพราะรู้ขนาดไม่ได้ช่วยให้เดาเฉลย
grading_rows: 3000
grading_public_ratio: 0.4
