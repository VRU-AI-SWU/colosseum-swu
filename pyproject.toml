[project]
name = "colosseum"
version = "0.1.0"
description = "Arena — แพลตฟอร์มแข่งขันสำหรับวิชา AI (core + runners)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# ตั้งใจให้บางมาก — core กับ runner ต้องรันได้โดยไม่มี torch/sklearn
# dependency ของโจทย์แต่ละตัวอยู่ใน envs/<competition>/pyproject.toml แยกกัน
dependencies = [
    "msgpack==1.1.*",
    "numpy>=2.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arena-agent-host = "runners.agent_env.agent_host:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "runners"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "runners/tests"]
markers = [
    "slow: การทดสอบที่รัน baseline ครบทุก seed (ใช้ `-m 'not slow'` ตอนพัฒนา)",
    "docker: ต้องมี Docker daemon ทำงานอยู่",
]
