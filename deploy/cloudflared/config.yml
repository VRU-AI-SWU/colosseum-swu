# cloudflared — เครื่อง GPU ในมหาวิทยาลัย (ที่ที่ API และ /srv/arena/secrets/ อยู่)
#
# คัดลอกไปที่ ~/.cloudflared/config.yml แล้วแทน <TUNNEL-ID> ด้วยค่าที่ได้จาก
#   cloudflared tunnel create porta-triumphalis     (หรือดูซ้ำด้วย cloudflared tunnel list)
#
# วิธีติดตั้งเต็มอยู่ที่ README.md ข้างไฟล์นี้

tunnel: <TUNNEL-ID>
credentials-file: /Users/rucci/.cloudflared/<TUNNEL-ID>.json

# auto = ลอง QUIC (UDP 7844) ก่อน ถ้าใช้ไม่ได้ตกไปใช้ http2 (TCP 7844) เอง
#
# ⚠️ **ห้าม pin เป็น `quic`** — เคยตั้งไว้แบบนั้นจากผลวัดวันเดียวที่ QUIC ทำงานดี
# ผลคือเมื่อเครือข่ายมหาวิทยาลัยเริ่มดรอป UDP มันวนพยายามต่อ QUIC ซ้ำๆ
# (3,500 ครั้งใน 24 ชม.) แทนที่จะตกไปใช้ TCP ที่ยังเปิดอยู่ตลอด
protocol: auto

# ทน network สะดุดโดยไม่ทิ้งงานที่กำลังรัน
retries: 5
grace-period: 30s

ingress:
  - hostname: colosseum-api.vru-ai.com
    service: http://127.0.0.1:8000
    originRequest:
      # การอัพโหลด submission ใหญ่ได้ถึงหลักสิบ MB และการตรวจไฟล์ตอนรับใช้เวลาสักครู่
      # ค่า default 30 วินาทีสั้นเกินไปจนตัดกลางคัน
      connectTimeout: 30s
      # ⚠️ ห้ามเปิด noTLSVerify — origin เป็น http บน localhost อยู่แล้ว
      # การเปิดทิ้งไว้จะกลายเป็นช่องโหว่ทันทีที่วันหนึ่งย้าย origin ไปเครื่องอื่น
      httpHostHeader: colosseum-api.vru-ai.com

  # ทุกอย่างที่ไม่ตรง hostname ข้างบนต้องถูกปฏิเสธ — ไม่ใช่ส่งต่อไปที่ origin
  # (ingress rule สุดท้ายบังคับให้ต้องมี)
  - service: http_status:404
